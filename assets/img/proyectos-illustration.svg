<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" height="100%" fill="none" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Ilustración de Proyectos Raíces Alzate</title>
  <desc id="svgDesc">Laptop con brote de planta en crecimiento, bombilla de innovación y elementos de proyectos colaborativos de egresados.</desc>

  <defs>
    <!-- Filtros de sombra suave -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.06" />
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>

    <!-- Gradientes lineales oficiales estrictos -->
    <linearGradient id="bgCircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F5F5" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5F5F5" />
    </linearGradient>

    <linearGradient id="plantStemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1565C0" />
      <stop offset="40%" stop-color="#D32F2F" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>

    <linearGradient id="bulbGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E3F2FD" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- ======================================================================
       1. FONDOS DECORATIVOS Y HALOS GEOMÉTRICOS (PALETA NEUTRA Y ACENTOS)
       ====================================================================== -->
  <!-- Halo central grande -->
  <circle cx="320" cy="240" r="190" fill="url(#bgCircleGrad)" />

  <!-- Anillos circulares tenues -->
  <circle cx="320" cy="240" r="215" stroke="#E0E0E0" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="320" cy="240" r="160" stroke="#1565C0" stroke-width="1" stroke-opacity="0.15" />

  <!-- Sombra de contacto en la base -->
  <ellipse cx="320" cy="425" rx="210" ry="14" fill="#212121" fill-opacity="0.05" />
  <ellipse cx="320" cy="425" rx="150" ry="8" fill="#212121" fill-opacity="0.07" />

  <!-- ======================================================================
       2. ESTRUCTURA DE LA COMPUTADORA PORTÁTIL (LAPTOP)
       ====================================================================== -->

  <!-- PANTALLA (Display) -->
  <g id="laptop-screen" filter="url(#softShadow)">
    <!-- Bisel exterior oscuro de la pantalla -->
    <rect x="155" y="130" width="330" height="230" rx="14" fill="#212121" />

    <!-- Cámara web y sensor -->
    <circle cx="320" cy="141" r="2.5" fill="#757575" />
    <circle cx="320" cy="141" r="1" fill="#1565C0" />

    <!-- Área de display activa -->
    <rect x="167" y="152" width="306" height="196" rx="6" fill="url(#screenGrad)" stroke="#E0E0E0" stroke-width="1" />

    <!-- Barra superior de la ventana del proyecto -->
    <rect x="167" y="152" width="306" height="28" rx="6" fill="#FFFFFF" />
    <line x1="167" y1="180" x2="473" y2="180" stroke="#E0E0E0" stroke-width="1" />

    <!-- Botones de ventana (Rojo Alzate, Neutro, Azul Institucional) -->
    <circle cx="184" cy="166" r="4.5" fill="#D32F2F" />
    <circle cx="199" cy="166" r="4.5" fill="#E0E0E0" />
    <circle cx="214" cy="166" r="4.5" fill="#1565C0" />

    <!-- Barra de dirección / Título de proyecto en pantalla -->
    <rect x="235" y="160" width="170" height="12" rx="6" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="0.8" />
    <rect x="245" y="164" width="75" height="4" rx="2" fill="#757575" />

    <!-- Contenido simulado en pantalla: Tablero de Proyectos -->
    <!-- Columna izquierda: Lista y tarjetas de iniciativas -->
    <rect x="180" y="194" width="130" height="52" rx="6" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" />
    <rect x="190" y="204" width="60" height="6" rx="3" fill="#212121" />
    <rect x="190" y="215" width="95" height="4" rx="2" fill="#757575" />
    <rect x="190" y="224" width="70" height="4" rx="2" fill="#1565C0" fill-opacity="0.6" />
    <circle cx="295" cy="208" r="5" fill="#D32F2F" fill-opacity="0.15" />
    <circle cx="295" cy="208" r="2.5" fill="#D32F2F" />

    <rect x="180" y="254" width="130" height="52" rx="6" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" />
    <rect x="190" y="264" width="50" height="6" rx="3" fill="#212121" />
    <rect x="190" y="275" width="85" height="4" rx="2" fill="#757575" />
    <rect x="190" y="284" width="45" height="4" rx="2" fill="#D32F2F" fill-opacity="0.6" />
    <circle cx="295" cy="268" r="5" fill="#1565C0" fill-opacity="0.15" />
    <circle cx="295" cy="268" r="2.5" fill="#1565C0" />

    <!-- Columna derecha: Gráfico y métricas de impacto -->
    <rect x="322" y="194" width="138" height="112" rx="6" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" />
    <rect x="334" y="206" width="65" height="6" rx="3" fill="#212121" />
    <rect x="334" y="217" width="90" height="4" rx="2" fill="#757575" />

    <!-- Barras de progreso de iniciativas -->
    <rect x="334" y="235" width="114" height="6" rx="3" fill="#F5F5F5" />
    <rect x="334" y="235" width="78" height="6" rx="3" fill="#1565C0" />

    <rect x="334" y="250" width="114" height="6" rx="3" fill="#F5F5F5" />
    <rect x="334" y="250" width="92" height="6" rx="3" fill="#D32F2F" />

    <rect x="334" y="265" width="114" height="6" rx="3" fill="#F5F5F5" />
    <rect x="334" y="265" width="55" height="6" rx="3" fill="#1565C0" />

    <!-- Mini puntos de estado -->
    <circle cx="340" cy="288" r="3" fill="#D32F2F" />
    <rect x="348" y="286" width="35" height="4" rx="2" fill="#757575" />
    <circle cx="395" cy="288" r="3" fill="#1565C0" />
    <rect x="403" y="286" width="35" height="4" rx="2" fill="#757575" />
  </g>

  <!-- BASE Y TECLADO DE LA LAPTOP -->
  <g id="laptop-base" filter="url(#softShadow)">
    <!-- Superficie del teclado con perspectiva -->
    <path d="M 120 382 L 520 382 L 495 362 L 145 362 Z" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1" />

    <!-- Teclado en bajo relieve -->
    <path d="M 185 365 L 455 365 L 442 377 L 198 377 Z" fill="#E0E0E0" fill-opacity="0.5" />
    <!-- Líneas de filas de teclas -->
    <line x1="205" y1="368" x2="435" y2="368" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="8 3" />
    <line x1="202" y1="373" x2="438" y2="373" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="10 4" />

    <!-- Touchpad -->
    <rect x="290" y="377" width="60" height="3" rx="1.5" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5" />

    <!-- Chasis inferior frontal -->
    <rect x="110" y="382" width="420" height="18" rx="7" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" />
    <!-- Muesca de apertura frontal -->
    <rect x="290" y="382" width="60" height="4" rx="2" fill="#E0E0E0" />
  </g>

  <!-- ======================================================================
       3. BROTE / PLANTA EN CRECIMIENTO ("RAÍCES ALZATE")
       ====================================================================== -->
  <g id="growing-plant">
    <!-- Raíces digitales conectando el chasis/pantalla al tallo -->
    <path d="M 270 380 Q 295 365 315 345" stroke="#1565C0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 370 380 Q 345 365 325 345" stroke="#1565C0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <circle cx="270" cy="380" r="2.5" fill="#1565C0" />
    <circle cx="370" cy="380" r="2.5" fill="#1565C0" />

    <!-- Tallo principal vigoroso que emerge de la laptop -->
    <path d="M 320 350 Q 312 280 326 210 Q 333 160 322 110" 
          stroke="url(#plantStemGrad)" stroke-width="6.5" stroke-linecap="round" fill="none" />

    <!-- Rama secundaria izquierda -->
    <path d="M 319 265 Q 285 245 260 250" 
          stroke="#D32F2F" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Rama secundaria derecha -->
    <path d="M 324 220 Q 360 205 385 215" 
          stroke="#D32F2F" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- HOJA 1: Grande izquierda inferior -->
    <g transform="translate(255, 248) rotate(-28)">
      <path d="M 0 0 C -25 -10 -35 -40 0 -55 C 35 -40 25 -10 0 0 Z" fill="#D32F2F" />
      <path d="M 0 0 C 15 -10 20 -35 0 -55" fill="#B71C1C" fill-opacity="0.35" />
      <line x1="0" y1="0" x2="0" y2="-45" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8" />
      <line x1="0" y1="-20" x2="-10" y2="-28" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.7" />
      <line x1="0" y1="-28" x2="10" y2="-36" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.7" />
    </g>

    <!-- HOJA 2: Mediana derecha -->
    <g transform="translate(385, 215) rotate(32)">
      <path d="M 0 0 C -20 -8 -28 -32 0 -45 C 28 -32 20 -8 0 0 Z" fill="#D32F2F" />
      <path d="M 0 0 C 12 -8 16 -28 0 -45" fill="#B71C1C" fill-opacity="0.35" />
      <line x1="0" y1="0" x2="0" y2="-38" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8" />
      <line x1="0" y1="-16" x2="-8" y2="-22" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.7" />
      <line x1="0" y1="-22" x2="8" y2="-28" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.7" />
    </g>

    <!-- HOJA 3: Pequeña izquierda superior -->
    <g transform="translate(318, 160) rotate(-42)">
      <path d="M 0 0 C -15 -6 -20 -24 0 -34 C 20 -24 15 -6 0 0 Z" fill="#D32F2F" />
      <line x1="0" y1="0" x2="0" y2="-28" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.8" />
    </g>

    <!-- BROTE / APICE SUPERIOR (Crecimiento activo) -->
    <g transform="translate(322, 110)">
      <!-- Brote central en ascenso -->
      <path d="M 0 0 C -10 -15 -8 -30 0 -40 C 8 -30 10 -15 0 0 Z" fill="#D32F2F" />
      <line x1="0" y1="0" x2="0" y2="-32" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.85" />
      
      <!-- Hoja lateral izquierda en desarrollo -->
      <path d="M -2 -10 C -16 -16 -18 -30 -10 -36 C -4 -28 -2 -18 -2 -10 Z" fill="#B71C1C" />

      <!-- Gotas / destellos de rocío y vitalidad -->
      <circle cx="-14" cy="-44" r="3.5" fill="#1565C0" />
      <circle cx="16" cy="-35" r="2.5" fill="#D32F2F" />
    </g>
  </g>

  <!-- ======================================================================
       4. BOMBILLA FLOTANTE DE INNOVACIÓN / PROYECTOS
       ====================================================================== -->
  <g id="lightbulb" filter="url(#cardShadow)">
    <g transform="translate(425, 75)">
      <!-- Resplandor exterior circular -->
      <circle cx="35" cy="35" r="52" fill="#E3F2FD" fill-opacity="0.6" />
      <circle cx="35" cy="35" r="42" fill="#FFFFFF" />

      <!-- Cristal de la bombilla -->
      <path d="M 35 10 
               C 21 10, 10 21, 10 35 
               C 10 44, 15 52, 23 58 
               L 23 66 
               C 23 68, 25 70, 27 70 
               L 43 70 
               C 45 70, 47 68, 47 66 
               L 47 58 
               C 55 52, 60 44, 60 35 
               C 60 21, 49 10, 35 10 Z" 
            fill="url(#bulbGlassGrad)" stroke="#1565C0" stroke-width="2.5" />

      <!-- Casquillo de rosca metálica -->
      <rect x="25" y="70" width="20" height="4" rx="1.5" fill="#757575" stroke="#212121" stroke-width="1" />
      <rect x="27" y="74" width="16" height="4" rx="1.5" fill="#757575" stroke="#212121" stroke-width="1" />
      <path d="M 30 78 L 40 78 C 40 81, 30 81, 30 78 Z" fill="#212121" />

      <!-- Filamento interior en Rojo Alzate (Idea en ignición) -->
      <path d="M 28 50 L 31 36 L 39 36 L 42 50" stroke="#D32F2F" stroke-width="2" stroke-linecap="round" fill="none" />
      <circle cx="35" cy="33" r="3" fill="#D32F2F" filter="url(#glowRed)" />

      <!-- Rayos / Destellos de inspiración -->
      <line x1="35" y1="-2" x2="35" y2="4" stroke="#D32F2F" stroke-width="2.5" stroke-linecap="round" />
      <line x1="68" y1="12" x2="62" y2="17" stroke="#1565C0" stroke-width="2" stroke-linecap="round" />
      <line x1="2" y1="12" x2="8" y2="17" stroke="#1565C0" stroke-width="2" stroke-linecap="round" />
      <line x1="72" y1="35" x2="66" y2="35" stroke="#D32F2F" stroke-width="2" stroke-linecap="round" />
      <line x1="-2" y1="35" x2="4" y2="35" stroke="#D32F2F" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- ======================================================================
       5. TARJETAS Y ELEMENTOS FLOTANTES DE PROYECTO
       ====================================================================== -->

  <!-- TARJETA FLOTANTE 1 (Izquierda Superior: Código / Tecnología) -->
  <g id="badge-code" filter="url(#cardShadow)">
    <g transform="translate(68, 120)">
      <!-- Fondo tarjeta píldora -->
      <rect x="0" y="0" width="115" height="46" rx="23" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5" />
      
      <!-- Ícono circular con Azul Institucional -->
      <circle cx="23" cy="23" r="16" fill="#E3F2FD" />
      <!-- Símbolo de código </> -->
      <path d="M 19 19 L 14 23 L 19 27" stroke="#1565C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M 27 19 L 32 23 L 27 27" stroke="#1565C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <line x1="24" y1="18" x2="22" y2="28" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" />

      <!-- Textos representativos de iniciativa técnica -->
      <rect x="47" y="16" width="50" height="5" rx="2.5" fill="#212121" />
      <rect x="47" y="25" width="35" height="4" rx="2" fill="#757575" />
    </g>
    <!-- Línea punteada de conexión al nodo central -->
    <path d="M 183 143 Q 220 155 240 180" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.4" />
  </g>

  <!-- TARJETA FLOTANTE 2 (Derecha Media: Impacto / Metas de Egresados) -->
  <g id="badge-impact" filter="url(#cardShadow)">
    <g transform="translate(485, 240)">
      <rect x="0" y="0" width="120" height="48" rx="12" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5" />
      
      <!-- Círculo de ícono en Rojo Alzate -->
      <circle cx="24" cy="24" r="16" fill="#FFEBEE" />
      <!-- Ícono de cohete / despegue institucional -->
      <path d="M 24 14 C 29 17, 30 22, 29 27 L 24 25 L 19 27 C 18 22, 19 17, 24 14 Z" fill="#D32F2F" />
      <circle cx="24" cy="20" r="2" fill="#FFFFFF" />
      <path d="M 21 26 L 18 30 L 21 28 Z" fill="#B71C1C" />
      <path d="M 27 26 L 30 30 L 27 28 Z" fill="#B71C1C" />
      <line x1="24" y1="26" x2="24" y2="32" stroke="#1565C0" stroke-width="1.5" stroke-linecap="round" />

      <!-- Barras de estado -->
      <rect x="48" y="16" width="55" height="6" rx="3" fill="#212121" />
      <rect x="48" y="26" width="40" height="4" rx="2" fill="#D32F2F" />
    </g>
    <!-- Línea punteada -->
    <path d="M 485 264 Q 455 260 435 245" stroke="#D32F2F" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.4" />
  </g>

  <!-- TARJETA FLOTANTE 3 (Izquierda Inferior: Comunidad de Egresados Conectada) -->
  <g id="badge-community" filter="url(#cardShadow)">
    <g transform="translate(60, 295)">
      <rect x="0" y="0" width="110" height="44" rx="10" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5" />
      
      <!-- Nodos de red / comunidad de egresados -->
      <circle cx="20" cy="22" r="5" fill="#1565C0" />
      <circle cx="34" cy="16" r="4" fill="#D32F2F" />
      <circle cx="34" cy="28" r="4" fill="#212121" />
      <line x1="20" y1="22" x2="34" y2="16" stroke="#E0E0E0" stroke-width="1.5" />
      <line x1="20" y1="22" x2="34" y2="28" stroke="#E0E0E0" stroke-width="1.5" />

      <rect x="48" y="16" width="48" height="5" rx="2.5" fill="#212121" />
      <rect x="48" y="24" width="32" height="4" rx="2" fill="#757575" />
    </g>
    <!-- Línea punteada hacia la base -->
    <path d="M 170 317 Q 200 330 220 365" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.4" />
  </g>

  <!-- ======================================================================
       6. DESTELLOS Y DETALLES DECORATIVOS (PARTÍCULAS EN ROJO Y AZUL)
       ====================================================================== -->
  <!-- Cruz/destello superior izquierda -->
  <path d="M 195 95 L 195 105 M 190 100 L 200 100" stroke="#1565C0" stroke-width="2" stroke-linecap="round" />

  <!-- Rombo rojo flotante -->
  <polygon points="415,185 419,189 415,193 411,189" fill="#D32F2F" />

  <!-- Cruz/destello derecha inferior -->
  <path d="M 465 375 L 465 385 M 460 380 L 470 380" stroke="#D32F2F" stroke-width="2" stroke-linecap="round" />

  <!-- Pequeños orbes flotantes de color -->
  <circle cx="150" cy="210" r="3.5" fill="#D32F2F" opacity="0.7" />
  <circle cx="480" cy="180" r="3" fill="#1565C0" opacity="0.7" />
  <circle cx="300" cy="90" r="2.5" fill="#212121" opacity="0.5" />
  <circle cx="365" cy="135" r="2.5" fill="#1565C0" opacity="0.6" />
</svg>
